[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moth-waveform"
version = "0.2.0"
description = "Quantum resonance hearing for spline-tension waveform extrapolation — temporal variables as first-class citizens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "quantumaudio>=0.2.0",
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
]

[tool.setuptools.packages.find]
include = ["moth_waveform*"]
